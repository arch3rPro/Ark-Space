left:3px solid var(--amber);padding:10px 12px;background:#2b291e;color:var(--amber);font-size:12px;margin:12px 0}.errorbox{color:var(--red);background:#341e29;padding:12px;margin-top:12px;max-height:160px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.small{display:none;position:absolute;inset:0;background:#101823;z-index:10;padding:25px;align-items:center;justify-content:center;text-align:center}.order-note{font-size:12px;color:var(--amber)}@media(max-width:760px){body{padding:10px}.work{grid-template-columns:140px 1fr}main{padding:14px}.sidebar{padding:14px 6px}.heading{align-items:flex-start;flex-direction:column}.meta{white-space:normal}.row{align-items:flex-start;flex-direction:column;gap:0}.top{padding:12px}.badge{max-width:100%}}@media(max-width:480px),(max-height:360px){.small{display:flex}dialog[open]{visibility:hidden}}

<section class="harness" aria-label="Prototype test harness"><div><strong class="badge">交互原型 · 合成数据 · 不连接真实服务</strong><div class="sub">Standalone design study / file:// · memory only</div></div><label for="scenario">测试场景 / Test scenario <select id="scenario" data-testid="scenario-picker"><option value="empty">Empty</option><option value="normal" selected>Normal</option><option value="many12">Many12</option><option value="external">External</option><option value="owned">Owned</option><option value="error">Error</option><option value="partial-save">Partial-save</option></select></label></section>

<script>
'use strict';
const $=id=>document.getElementById(id);
const names={exa:'Exa',tavily:'Tavily',firecrawl:'Firecrawl',sx:'SearXNG'};
const words={title:['设置工作区','Setup workspace'],subtitle:['同一工作区 · 明确的对象 · 默认拒绝','One workspace · explicit objects · default deny'],providers:['服务提供方','Providers'],settings:['全局设置','Settings'],order:['搜索顺序','Search order'],language:['语言','Language'],keys:['API 密钥引用','API key references'],instances:['实例','Instances'],configured:['已配置（未探测）','Configured (not probed)'],add:['添加','Add'],replace:['替换','Replace'],edit:['编辑','Edit'],enable:['启用','Enable'],disable:['停用','Disable'],remove:['删除','Remove'],test:['测试连接','Test connection'],empty:['尚未添加资源','No resources yet'],cancel:['取消','Cancel'],save:['保存','Save'],yes:['是','Yes'],no:['否','No'],local:['本地','Local'],environment:['环境','Environment'],shared:['共享','Shared'],owned:['已归属其他资源','Owned by another resource'],ready:['就绪 · 仅合成数据，所有操作只保留在内存','Ready · synthetic data only; all changes stay in memory'],saved:['已保存（模拟）','Saved (simulated)'],envReason:['由环境变量管理：不可替换；删除只取消引用，不删除环境变量。','Managed by environment: replacement unavailable; removal only unregisters the reference.'],guard:['资源由其他对象拥有；不允许替换或删除。可停用密钥，但保留引用以便清理。','Resource is owned by another object; replacement and removal are blocked. The key may be disabled; its reference remains for cleanup.'],sharedReason:['共享凭据只读：不可替换；可取消此引用，不删除共享凭据。','Shared credential is read-only: replacement blocked; unlinking this reference is allowed and does not delete the shared credential.'],providerOwnedReason:['仍有已归属资源：不可停用 Provider；可停用单个密钥并保留清理引用。','Owned resources remain: provider cannot be disabled; individual keys may be disabled while retaining cleanup references.'],externalProviderReason:['Provider 由外部环境管理：此处只读，不可本地切换。','Provider is externally managed: read-only here; no local toggle.'],confirmCancel:['N取消','NCancel'],confirmYes:['Y确认','YConfirm'],footer:['Tab / Shift-Tab 切换区域 · 方向键选择 · Enter 操作 · Esc 返回 · 列表 a/e/d','Tab / Shift-Tab regions · arrows select · Enter activate · Esc back · list a/e/d'],up:['上移','Move up'],down:['下移','Move down'],apply:['应用','Apply'],synthetic:['固定合成凭据 · 不是实际密钥','Fixed synthetic credential · not an actual key']};
const model=ArkSetupPrototype.createPrototypeModel();
let state=model.snapshot(),modal=null,returnFocus=null;
function act(action,payload={}){const result=model.dispatch(action,payload);state=model.snapshot();return result;}
window.prototypeModel=model;
const t=k=>words[k]?.[state.lang==='zh'?0:1]||k;
const msg=(zh,en)=>state.lang==='zh'?zh:en;
function setScenario(value){if($('modal').open)$('modal').close();modal=null;act('scenario',{scenario:value});$('scenario').value=state.scenario;render();status(t('ready'));}
Object.defineProperty(window,'prototypeState',{get:()=>model.snapshot()});window.setPrototypeScenario=setScenario;
function button(id,text,fn,reason='',extra=''){const b=document.createElement('button');b.type='button';b.id=id;b.dataset.testid=id;b.textContent=text;b.onclick=()=>{if(reason){status(reason,'error');return;}fn();};if(reason){b.setAttribute('aria-disabled','true');b.title=reason;b.setAttribute('aria-label',text+' — '+reason);b.onfocus=()=>status(reason);}if(extra)b.className=extra;return b;}
function status(text,kind=''){const el=$('status');el.textContent=text;el.className='status '+kind;}
function group(el,name){el.dataset.region=name;return el;}
function selected(){return state.providers[state.page]?.resources.find(r=>r.ref===state.selected[state.page]);}
function render(focusId){$('app-title').textContent=t('title');$('subtitle').textContent=t('subtitle');$('footer').textContent=t('footer');const nav=$('sidebar');nav.replaceChildren();group(nav,'sidebar');const h=document.createElement('h3');h.textContent=t('providers');nav.append(h);for(const p of [...Object.keys(names),'order','language']){if(p==='order'){const sh=document.createElement('h3');sh.className='settings';sh.textContent=t('settings');nav.append(sh);}const b=button('nav-'+p,names[p]||t(p),()=>{act('navigate',{page:p});render('nav-'+p);status(t('ready'));});b.dataset.page=p;if(state.page===p)b.setAttribute('aria-current','page');nav.append(b);}const main=$('content');main.replaceChildren();if(state.page==='order')renderOrder(main);else if(state.page==='language')renderLanguage(main);else renderProvider(main);updateRoving();if(focusId)$(focusId)?.focus();}
function updateRoving(){document.querySelectorAll('[data-region]').forEach(g=>{const bs=[...g.querySelectorAll('button')];let chosen=bs.find(b=>b.getAttribute('aria-selected')==='true'||b.getAttribute('aria-current')==='page')||bs[0];bs.forEach(b=>b.tabIndex=b===chosen?0:-1);});}
function renderProvider(main){const p=state.page,provider=state.providers[p],r=selected();const heading=document.createElement('div');heading.className='heading';const title=document.createElement('div');const titleHeading=document.createElement('h2');titleHeading.textContent=names[p];const titleSub=document.createElement('div');titleSub.className='sub';titleSub.textContent=(p==='sx'?'Self-hosted search':'Web search provider')+' / '+msg('合成工作区','Synthetic workspace');title.append(titleHeading,titleSub);const controls=group(document.createElement('div'),'provider');controls.className='provider-controls';controls.append(button('provider-toggle',`Provider · ${t(provider.enabled?'disable':'enable')}`,()=>{const result=act('provider-toggle');render('provider-toggle');if(result.status==='error'){status(dispatchReason(result.code),'error');return;}status(t('saved'),'success');},provider.externallyManaged?t('externalProviderReason'):p==='sx'&&!provider.resources.length?msg('请先添加本地实例','Add a local instance first'):provider.enabled&&provider.resources.some(x=>x.source==='owned')?t('providerOwnedReason'):''),button('test-connection',t('test'),()=>{const result=act('test-request');if(result.status==='error'){status(dispatchReason(result.code),'error');return;}confirm('test',msg('模拟测试连接','Simulated connection test'),`${names[p]} · query: “Agent Skills documentation”\n${msg('真实操作可能产生费用与日志。本原型不发请求。','A real test could incur costs and logs. This prototype makes no requests.')}`,()=>{status(msg('模拟结果：成功 · 仅假数据；未联网，未验证任何真实密钥。','Simulated result: success · fake data only; no network or real key verified.'),'success');});},!provider.enabled?msg('Provider 已停用','Provider is disabled'):!(p==='sx'?provider.resources.length:provider.resources.some(x=>x.enabled))?msg('缺少启用的凭据 / 已配置实例','No enabled credential / configured instance'):''));heading.append(title,controls);main.append(heading);const box=document.createElement('section');box.className='region';box.setAttribute('aria-label',t(p==='sx'?'instances':'keys'));const h=document.createElement('h3');h.textContent=t(p==='sx'?'instances':'keys');box.append(h);const list=group(document.createElement('div'),'resources');list.className='resources';list.dataset.testid='resource-list';if(!provider.resources.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=t('empty');empty.append(button('empty-add',t('add'),()=>openEditor('add')));list.append(empty);}provider.resources.forEach((row,i)=>{const b=button('resource-'+p+'-'+(i+1),'',()=>{act('select',{provider:p,ref:row.ref});render('resource-'+p+'-'+(i+1));});b.className='row';b.dataset.ref=row.ref;b.setAttribute('aria-selected',String(row.ref===state.selected[p]));const ref=document.createElement('span');ref.className='ref';ref.textContent=(row.ref===state.selected[p]?'› ':'  ')+row.ref;const meta=document.createElement('span');meta.className='meta';meta.textContent=t(row.source)+' · '+t(p==='sx'?'configured':row.enabled?'enable':'disable');b.append(ref,meta);b.addEventListener('focus',()=>{if(state.selected[p]!==row.ref){act('select',{provider:p,ref:row.ref});render('resource-'+p+'-'+(i+1));}});list.append(b);});box.append(list);main.append(box);const detail=document.createElement('div');detail.id='resource-details';detail.className='details';detail.dataset.testid='resource-details';main.append(detail);showDetails();const actions=group(document.createElement('div'),'actions');actions.className='actions';const noResource=msg('请先选择资源','Select a resource first');const reason=r?guard(r,'replace'):noResource;actions.append(button('resource-add',t('add'),()=>openEditor('add')),button('resource-replace',t(p==='sx'?'edit':'replace'),()=>openEditor('replace'),reason));if(p !== 'sx')actions.append(button('resource-toggle',t(r?.enabled?'disable':'enable'),()=>{const result=act('resource-toggle');render('resource-toggle');status(result.status==='error'?dispatchReason(result.code):t('saved'),result.status==='error'?'error':'success');},r?'':noResource));actions.append(button('resource-remove',t('remove'),removeResource,r?guard(r,'remove'):noResource,'danger'));main.append(actions);}
function showDetails(){const d=$('resource-details'),r=selected();if(d)d.textContent=r?`${r.ref} · ${t(r.source)}${r.permission?' · '+r.permission+(r.cidr?' / '+r.cidr:''):''}`:msg('零占位条目。添加后选中新对象。','No placeholder entries. Adding selects the new object.');}
function guard(r,action){const code=ArkSetupPrototype.guard(r,action);return code==='ownership'?t('guard'):code==='shared'?t('sharedReason'):code==='environment'?t('envReason'):code==='externally-managed'?t('externalProviderReason'):code?msg('请选择资源','Select a resource'):'';}
function dispatchReason(code){return code==='ownership'?t('providerOwnedReason'):code==='externally-managed'?t('externalProviderReason'):code==='order-minimum'?msg('删除最后一个 SearXNG 实例会清除其搜索顺序条目。请先在已保存的顺序中添加其他 Provider。','Removing the last SearXNG instance removes it from search order. Add another provider to the saved order first.'):code==='no-local-instance'?msg('请先添加本地实例','Add a local instance first'):code==='instance-toggle-unavailable'?msg('实例没有独立启停开关。请使用 Provider 开关。','Instances have no individual enable switch. Use the provider control.'):code;}
function removeResource(){const p=state.page,r=selected();if(!r)return;const result=act('remove-request');if(result.status==='error'){status(dispatchReason(result.code),'error');return;}confirm('remove',t('remove'),`${names[p]} / ${r.ref}\n${r.source==='environment'?t('envReason'):msg('删除此合成资源？','Remove this synthetic resource?')}`,()=>{const list=state.providers[p].resources,i=list.findIndex(x=>x.ref===state.selected[p]);render(i>=0?'resource-'+p+'-'+(i+1):'empty-add');status(t('saved'),'success');});}
function beginModal(type,title){returnFocus=document.activeElement?.id;modal={type};const d=$('modal');d.replaceChildren();const h=document.createElement('h2');h.id='modal-title';h.textContent=title;d.append(h);const badge=document.createElement('p');badge.className='sub';badge.textContent=msg('交互原型 · 合成数据 · 不连接真实服务','Interaction prototype · synthetic data · no real services');d.append(badge);d.showModal();return d;}
function closeModal(cancel=true){if(!$('modal').open)return;if(cancel)act('cancel');$('modal').close();modal=null;$(returnFocus)?.focus();if(cancel&&state.partialCredentialSaved)status(msg('部分保存未回滚：孤立合成凭据仍在内存，未登记为可用资源。','Partial save not rolled back: orphan dummy credential remains in memory, not registered.'),'error');}
function confirm(type,title,text,fn){const d=beginModal('confirm',title);modal.action=type;modal.confirm=()=>{const result=act('confirm',{yes:true});if(result.status==='error'){const text=dispatchReason(result.code);editorError(text);status(text,'error');$('confirm-no')?.focus();return;}closeModal(false);fn();};const p=document.createElement('p');p.style.whiteSpace='pre-wrap';p.style.marginTop='18px';p.textContent=text;d.append(p);const notice=document.createElement('div');notice.className='notice';notice.textContent=msg('确认？ [y/N] · Enter 默认取消','Confirm? [y/N] · Enter cancels by default');d.append(notice);const actions=document.createElement('div');actions.className='actions';actions.append(button('confirm-no',t('confirmCancel'),closeModal),button('confirm-yes',t('confirmYes'),()=>modal.confirm(),'','primary'));d.append(actions);$('confirm-no').focus();}
function field(d,id,label,type,value){const l=document.createElement('label');l.htmlFor=id;l.textContent=label;d.append(l);const input=document.createElement(type==='select'?'select':'input');input.id=id;input.dataset.testid=id;if(type!=='select')input.type='text';if(type==='select')for(const [v,labelText] of value){const o=document.createElement('option');o.value=v;o.textContent=labelText;input.append(o);}else input.value=value;d.append(input);return input;}
function editorError(text){let e=$('modal-error');if(!e){e=document.createElement('div');e.id='modal-error';e.dataset.testid='modal-error';e.className='errorbox';e.setAttribute('role','alert');$('modal').insertBefore(e,$('modal-actions'));}e.textContent=text;}
function openEditor(mode){const p=state.page,r=selected();if(mode==='replace'&&(!r||guard(r,'replace'))){status(r?guard(r,'replace'):msg('请选择资源','Select resource'),'error');return;}const result=act('editor-open',{mode});if(result.status==='error'){status(result.code,'error');return;}const original=state.dialog.original;const d=beginModal('editor',`${t(mode==='add'?'add':p==='sx'?'edit':'replace')} ${names[p]}`);modal.provider=p;modal.original=original;modal.mode=mode;modal.target=original?.ref;modal.permissionConfirmed=false;if(original){const target=document.createElement('p');target.textContent=original.ref;target.style.overflowWrap='anywhere';d.append(target);}if(p==='sx'){field(d,'instance-url','URL','text',original?.ref||'https://search-new.example/');const perm=field(d,'network-permission',msg('网络权限','Network permissions'),'select',[['public',msg('仅公共网络','Public network only')],['private',msg('私网 / 私有 DNS · 需窄范围授权','Private / private DNS · narrow authorization required')]]);perm.value=original?.permission||'public';field(d,'network-cidr',msg('窄范围 CIDR（私网必填，/32 或 /128）','Narrow CIDR (required for private, /32 or /128)'),'text',original?.cidr||'');$('instance-url').addEventListener('input',()=>{const previous=state.dialog.draft;act('editor-draft',{url:$('instance-url').value});const draft=state.dialog.draft;perm.value=draft.permission;$('network-cidr').value=draft.cidr;const hint=$('permission-reset');hint.textContent=previous.permission!==draft.permission||previous.cidr!==draft.cidr?msg('URL 已改变：旧权限已清除，必须重新授权。','URL changed: old permissions cleared; authorization must be renewed.'):msg('同一规范 URL 保留权限；不同端点不继承旧权限。','The same canonical URL retains permissions; different endpoints do not inherit permissions.');});for(const id of ['network-permission','network-cidr'])$(id).addEventListener('input',()=>act('editor-draft',id==='network-permission'?{permission:$(id).value}:{cidr:$(id).value}));const hint=document.createElement('p');hint.id='permission-reset';hint.class function askInsideEditor(kind,text,continuation){const d=$('modal');d.querySelectorAll('input,select,#modal-actions button').forEach(el=>el.disabled=true);let panel=$('editor-confirm');if(panel)panel.remove();panel=document.createElement('section');panel.id='editor-confirm';panel.dataset.testid=kind+'-confirmation';panel.className='notice';const p=document.createElement('p');p.textContent=text+' [y/N]';panel.append(p);const actions=document.createElement('div');actions.className='actions';const accept=()=>{modal.pendingConfirm=null;panel.remove();d.querySelectorAll('input,select,#modal-actions button').forEach(el=>el.disabled=false);continuation();};actions.append(button('editor-confirm-no',t('confirmCancel'),closeModal),button('editor-confirm-yes',t('confirmYes'),accept,'','primary'));panel.append(actions);d.insertBefore(panel,$('modal-actions'));modal.pendingConfirm=accept;$('editor-confirm-no').focus();}
const errorMessages={url:['请输入有效 http(s) URL（最多 4096 字符），不含空白、控制字符、反斜线、用户信息、查询或片段。','Enter valid http(s) URL (max 4096 characters) without whitespace, controls, backslashes, user info, query or fragment.'],permission:['私网端点需要明确授权。','Private endpoint needs explicit authorization.'],cidr:['仅接受单个私网地址 /32 或 /128，不接受宽网段。','Only a single private address /32 or /128; no broad networks.'],'cidr-match':['CIDR 必须匹配此私网 IP。','CIDR must match this private IP.'],duplicate:['此实例已经存在，请使用不同 URL。','Instance already exists; use another URL.'],'save-failed':['模拟保存失败：草稿保留，可重试或取消；未联网。','Simulated save failure: draft retained; retry or cancel. No network.'],'partial-save':['部分保存（模拟）：合成凭据已保存，但注册失败。未回滚，列表未加入。恢复：重试注册；取消后孤立凭据元数据仍留在内存。','Partial save (simulated): dummy credential saved, registration failed. Not rolled back; not in list. Recovery: retry registration; cancel retains orphan metadata in memory.']};
function saveEditor(){if(!modal||modal.type!=='editor'||modal.pendingConfirm)return;handleEditorResult(act('editor-save'));}
function handleEditorResult(result){if(result.status==='confirm'){const text=result.kind==='private-network'?msg('授权此 URL 的窄范围访问（模拟）：','Authorize narrow URL access (simulated): ')+result.resource.ref+' → '+result.resource.cidr:msg('覆盖此合成对象？','Overwrite this synthetic object?')+' '+result.target;askInsideEditor(result.kind,text,()=>handleEditorResult(act('confirm',{yes:true})));return;}if(result.status==='error'){const words=errorMessages[result.code]||[result.code,result.code];editorError(msg(...words));const fieldId={url:'instance-url',permission:'network-permission',cidr:'network-cidr','cidr-match':'network-cidr'}[result.code]||(modal.provider==='sx'?'instance-url':'dummy-key');$(fieldId)?.focus();return;}if(result.status==='saved'){const p=modal.provider;closeModal(false);const i=state.providers[p].resources.findIndex(x=>x.ref===result.ref);render('resource-'+p+'-'+(i+1));status(t('saved'),'success');}}
function renderLanguage(main){const h=document.createElement('h2');h.textContent=t('language');main.append(h);const section=group(document.createElement('section'),'resources');section.className='region';for(const [lang,label] of [['zh','中文'],['en','English']]){const b=button('language-'+lang,label+(state.lang===lang?' ✓':''),()=>{act('language',{lang});document.documentElement.lang=lang==='zh'?'zh-CN':'en';render('language-'+lang);status(t('saved'),'success');});b.className='row';b.setAttribute('aria-selected',String(state.lang===lang));section.append(b);}main.append(section);const p=document.createElement('p');p.className='details';p.textContent=msg('应用到整个原型。仅会话内存；不改变查询语言或真实配置。','Applied globally in the prototype. Session memory only; no query language or real configuration changes.');main.append(p);}
function renderOrder(main){const draft=state.orderDraft;const h=document.createElement('h2');h.textContent=t('order');main.append(h);const note=document.createElement('p');note.className='order-note';note.textContent=msg('草稿 · 保存一次提交；启用状态独立','Draft · one save to commit; enabled state is separate');main.append(note);const box=group(document.createElement('section'),'resources');box.className='region resources';box.dataset.testid='order-list';draft.forEach(p=>{const b=button('order-row-'+p,names[p]+' · '+t(state.providers[p].enabled?'enable':'disable'),()=>{act('order-select',{provider:p});render('order-row-'+p);});b.className='row';b.dataset.ref=p;b.setAttribute('aria-selected',String(state.orderSelected===p));b.onfocus=()=>{act('order-select',{provider:p});box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.ref===p)));};box.append(b);});main.append(box);const actions=group(document.createElement('div'),'actions');actions.className='actions';const move=delta=>{act('order-move',{delta});render('order-'+(delta<0?'up':'down'));};actions.append(button('order-up',t('up'),()=>move(-1)),button('order-down',t('down'),()=>move(1)),button('order-remove',t('remove'),()=>{const result=act('order-remove');if(result.status==='error'){status(msg('至少保留一个 Provider。','Keep at least one provider.'),'error');return;}render('order-remove');}),button('order-add',t('add'),()=>{const missing=Object.keys(names).filter(p=>!state.orderDraft.includes(p));if(!missing.length){status(msg('所有 Provider 已在顺序中。','All providers are already in the order.'));return;}const d=beginModal('order-add',t('add'));const select=field(d,'order-add-provider','Provider','select',missing.map(p=>[p,names[p]]));const a=document.createElement('div');a.className='actions';a.append(button('order-add-cancel',t('cancel'),closeModal),button('order-add-save',t('add'),()=>{const p=select.value;act('order-add',{provider:p});closeModal(false);render('order-row-'+p);},'','primary'));d.append(a);select.focus();}),button('order-cancel',t('cancel'),()=>{act('order-cancel');render('order-cancel');status(msg('草稿已取消','Draft canceled'));}),button('order-save',t('save'),()=>{const result=act('order-save');if(result.status==='error'){status(result.code,'error');return;}confirm('order-save',msg('保存顺序预览','Save order preview'),result.previous.map(p=>names[p]).join(' → ')+'\n↓\n'+result.next.map(p=>names[p]).join(' → ')+(result.privacyChanged?'\n'+msg('SearXNG 路由改变：请确认查询隐私影响（模拟）。','SearXNG routing changed: confirm query privacy impact (simulated).'):''),()=>{render('order-save');status(t('saved'),'success');});},'','primary'));main.append(actions);}
function focusRegion(direction){const regions=[...document.querySelectorAll('.work [data-region]')].filter(g=>g.querySelector('button'));const active=document.activeElement?.closest('[data-region]');let index=regions.indexOf(active);index=(index+direction+regions.length)%regions.length;const target=regions[index];(target.querySelector('button[tabindex="0"]')||target.querySelector('button'))?.focus();}
document.addEventListener('keydown',e=>{if(window.matchMedia('(max-width:480px),(max-height:360px)').matches){if(e.key==='Escape'){e.preventDefault();closeModal();}else if(!e.target.closest('.harness')&&e.key!=='Tab'){e.preventDefault();}return;}const input=/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);if($('modal').open){if(e.key==='Escape'){e.preventDefault();closeModal();return;}if(e.key==='Tab'){const controls=[...$('modal').querySelectorAll('button,input,select')].filter(x=>!x.disabled);let i=controls.indexOf(document.activeElement);e.preventDefault();controls[(i+(e.shiftKey?-1:1)+controls.length)%controls.length]?.focus();return;}if((modal.type==='confirm'||modal.pendingConfirm)&&!input){if(['y','Y'].includes(e.key)){e.preventDefault();(modal.pendingConfirm||modal.confirm)();}else if(e.key==='Enter'){e.preventDefault();if(['confirm-yes','editor-confirm-yes'].includes(document.activeElement?.id))document.activeElement.click();else closeModal();}else if(['n','N'].includes(e.key)){e.preventDefault();closeModal();}return;}return;}
if(e.target.closest('.harness'))return;if(e.key==='Escape'){e.preventDefault();$('nav-'+state.page)?.focus();status(msg('返回侧栏 · 原型不退出进程','Back to sidebar · prototype does not exit a process'));return;}if(e.key==='Tab'){e.preventDefault();focusRegion(e.shiftKey?-1:1);return;}const region=e.target.closest('[data-region]');if(!region||input)return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','End','PageUp','PageDown'].includes(e.key)){e.preventDefault();const bs=[...region.querySelectorAll('button')];let i=bs.indexOf(document.activeElement);const delta=['ArrowUp','ArrowLeft'].includes(e.key)?-1:e.key==='PageUp'?-6:e.key==='PageDown'?6:1;i=e.key==='Home'?0:e.key==='End'?bs.length-1:Math.max(0,Math.min(bs.length-1,i+delta));bs.forEach((b,j)=>b.tabIndex=j===i?0:-1);bs[i]?.focus();bs[i]?.scrollIntoView({block:'nearest'});return;}if(region.dataset.region==='resources'&&names[state.page]){const id={a:'resource-add',e:'resource-replace',d:'resource-remove'}[e.key.toLowerCase()];if(id){e.preventDefault();$(id)?.click();}}});
