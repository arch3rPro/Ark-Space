interface:
  display_name: "Notes"
  short_description: "Write retrievable, readable notes from research results"
  default_prompt: >-
    Use $notes to turn these research results into a note with sourced facts,
    marked inferences, complete usage guidance, and a lint check before delivery.
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"

policy:
  allow_implicit_invocation: true
